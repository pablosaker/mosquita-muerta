name: Top 5 para el banner

# Regenera top5.svg (el top 5 que se ve en el banner de bajocuerda.net)
# y lo sube solo si cambió. GitHub corre los horarios con algunos minutos de retraso.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top5
  cancel-in-progress: false

jobs:
  top5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/top5.mjs
      - name: Subir si cambió
        run: |
          if git diff --quiet -- top5.svg; then echo "Sin cambios"; exit 0; fi
          git config user.name "top5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top5.svg
          git commit -m "Actualiza top 5 del banner"
          git push
