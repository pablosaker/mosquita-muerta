/* ---------- canvas fit ---------- */
let dpr = 1;
function fit() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const phone = COARSE || touchMode;
  H = phone ? 520 : 720; FLOOR = H - 36;
  const aspect = innerWidth / Math.max(1, innerHeight);
  W = Math.round(clamp(H * aspect, phone ? H * 1.5 : 1280, H * 2.4));
  if (!phone) W = Math.max(1280, Math.min(W, 1600));
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.width = W * dpr; cv.height = H * dpr;
}
addEventListener('resize', () => fit());
document.getElementById('fs').addEventListener('click', () => {
  initAudio();
  const el = document.documentElement;
  try { if (!document.fullscreenElement) el.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (e) {}
});

/* ---------- audio ---------- */
let ac = null, muted = false;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
}
function tone(f, d, type = 'square', v = 0.08, f2) {
  if (!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
  g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.0001, n + d);
  o.connect(g).connect(ac.destination); o.start(n); o.stop(n + d + 0.02);
}
const sfx = {
  join() { tone(440, .1, 'square', .06); setTimeout(() => tone(660, .12, 'square', .06), 90); },
  drop() { tone(1250, .06, 'sine', .05); },
  hop() { tone(500, .3, 'triangle', .09, 1100); },
  dash() { tone(180, .12, 'sawtooth', .035, 520); },
  swat() { tone(95, .3, 'square', .16, 40); },
  zap() { tone(1700, .35, 'sawtooth', .07, 180); },
  stick() { tone(160, .22, 'triangle', .1, 80); },
  mash() { tone(280 + Math.random() * 120, .04, 'square', .04); },
  free() { tone(400, .15, 'triangle', .08, 900); },
  revive() { tone(600, .35, 'sine', .09, 1300); },
  shield() { tone(220, .2, 'square', .07, 110); },
  over() { tone(330, .25, 'square', .07, 220); setTimeout(() => tone(220, .5, 'square', .07, 110), 220); }
};

/* ---------- input: 2 teclados + hasta 4 gamepads / encoders arcade ---------- */
const keys = new Set(), hits = new Set();
const BLOCK = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter'];
addEventListener('keydown', e => {
  if (BLOCK.includes(e.code)) e.preventDefault();
  if (!e.repeat) hits.add(e.code);
  keys.add(e.code); initAudio();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
cv.addEventListener('pointerdown', initAudio);
const KB = {

  kbB: { u: 'ArrowUp', d: 'ArrowDown', l: 'ArrowLeft', r: 'ArrowRight', b: ['Enter', 'NumpadEnter', 'ShiftRight'] }
};

let touchMode = false, fsTried = false;
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const TOUCH_GAIN = 1.3;
const tch = { id: null, lx: 0, ly: 0, dx: 0, dy: 0, t0: 0, travel: 0 }, touchHits = new Set();
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function enterTouchMode() {
  if (touchMode) return;
  touchMode = true; fit();
  const b = document.getElementById('fs'); if (b) b.style.display = 'none';

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);

let best = 0;
try { best = +localStorage.getItem('mosca_best') || 0; } catch (e) {}

/* ---------- escenas ---------- */
const SCENES = [
  { k: 'planta', n: 'PLANTA DE PRODUCCIÓN' },

/* ---------- estado ---------- */
let state = 'title', clock = 0;
let players = [], obs = [], items = [], fx = [], bg = [];
let t = 0, speed = 0, dist = 0, score = 0, mult = 1, countdown = -1;
let sceneIdx = 0, banner = null, overT = 0, nextObs = 0, nextItem = 0, nextHop = 0, newBest = false;
let sed = 100, combo = 0, comboT = 0, nextGate = 0, overWhy = '', hintT = 0;
const RMAX = 230, SW_OFF = 300;
let gatesSeen = 0;

function newPlayer(src, i) {

function resetPlayer(p, i, n) {

/* ---------- la cuerda ---------- */
function links() { const l = []; for (let i = 0; i < players.length - 1; i++) l.push([players[i], players[i + 1]]); return l; }

}
function startGame() {

/* ---------- spawners ---------- */
function livingFlies() { return players.filter(p => p.alive); }
function spawnObs() {
  const r = Math.random();
  const hard = clamp(t / 120, 0, 1);
  if (r < 0.34 && t > 4) {
    const live = livingFlies(); if (!live.length) return;
    const tg = live[Math.floor(Math.random() * live.length)];
    const warn = Math.max(0.7, 1.15 - t * 0.004);

/* ---------- fx ---------- */

/* ---------- jugadores ---------- */
function movePlayer(p, inp, dt, inGame) {
  p.cd -= dt; p.inv -= dt;

  if (p.deadT > 0) { p.deadT -= dt; p.vx *= .9; p.vy *= .9; p.x += p.vx * dt; p.y += p.vy * dt; return; }
  if (inp.rel && (inp.rx || inp.ry)) { const l = Math.hypot(inp.rx, inp.ry); p.dirX = inp.rx / l; p.dirY = inp.ry / l; }

  }

/* ---------- update ---------- */
function update(dt) {
  clock += dt;
  const inp = pollInputs();
  for (const f of fx) { f.life -= dt; if (f.k === 'pt') { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= .92; f.vy *= .92; } else f.y -= 30 * dt; }

  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }

  if (state === 'title') {
    scrollBg(90 * dt, 'planta');
    for (const s of SOURCES) {
      if (inp[s].p && !players.some(p => p.src === s) && players.length < 4) {
        const p = newPlayer(s, players.length); players.push(p);
        countdown = s === 'tch' ? 2.2 : 4; sfx.join(); say(p.x, p.y - 50, 'P' + (p.i + 1) + ' ADENTRO', p.color, 24);
        inp[s].p = false;
      }
    }
    players.forEach(p => movePlayer(p, inp[p.src], dt, false));
    ropeSolve();
    if (countdown > 0) { const before = Math.ceil(countdown); countdown -= dt; if (Math.ceil(countdown) !== before && countdown > 0) tone(520, .08, 'square', .05); if (countdown <= 0) { tone(880, .2, 'square', .07); startGame(); } }
    return;
  }

    scrollBg(40 * dt, SCENES[sceneIdx].k);
    if (overT > 1.6 && SOURCES.some(s => inp[s].p)) toTitle();
    return;
  }

  /* ---- play ---- */
  t += dt;
  speed = Math.min(620, 250 + t * 6);
  const dx = speed * dt;
  dist += dx;
  const si = Math.floor(dist / SCENE_LEN) % SCENES.length;
  if (si !== sceneIdx) { sceneIdx = si; banner = { txt: SCENES[si].n, sub: 'ESCENA ' + (Math.floor(dist / SCENE_LEN) + 1), life: 2.4 }; tone(660, .15, 'triangle', .06); }
  scrollBg(dx * .45, SCENES[sceneIdx].k);

  nextObs -= dx;
  if (nextObs <= 0) { spawnObs(); nextObs = lerp(600, 330, clamp(t / 120, 0, 1)) * rand(.8, 1.3); }
  nextItem -= dx;
  if (nextItem <= 0) { spawnDrops(); nextItem = rand(600, 950); }
  nextHop -= dx;
  if (nextHop <= 0) { items.push({ k: 'hop', x: W + 40, y: rand(CEIL + 70, FLOOR - 70) }); nextHop = rand(6500, 10000); }

  if (nextGate <= 0) {

    if (!gatesSeen++) banner = { txt: '¡COMPUERTA!', sub: solo ? 'TOQUE EL INTERRUPTOR PARA ABRIRLA' : 'UNA MOSCA POR CADA INTERRUPTOR', life: 2.6 };

        if (circRect(p.x, p.y, 15, o.x - o.w / 2, y0, o.w, o.len)) {
          if (p.shield) { kill(p, 'tape'); }
          else { p.stuck = o; p.mash = 6; p.vx = p.vy = 0; p.x = o.x; sfx.stick(); say(p.x, p.y - 44, '¡PEGADA! ¡AYÚDENLA!', p.color, 20); }
        }

    }

        break;

      say(o.x, H / 2 - 80, '¡ABIERTA! +200', AMBER, 36, 1.4); burst(o.x, H / 2, AMBER, 26);
      continue;
    }
    if (alive.some(p => p.x + 16 > o.x - 22)) {
      o.open = true; o.broken = true; sed -= 30; sfx.swat();
      alive.forEach(p => { p.inv = Math.max(p.inv, 1); p.vx = -200; });
      say(o.x, H / 2 - 80, '¡ESTRELLADAS! −30 SED', RED, 34, 1.4); burst(o.x, H / 2, INK, 30);

  ctx.strokeStyle = PAPER; ctx.globalAlpha = .25; ctx.lineWidth = 2; ctx.beginPath();
  const off = (dist * .9) % 24;
  for (let x = -off; x < W; x += 24) { ctx.moveTo(x, FLOOR + 8); ctx.lineTo(x + 12, H - 6); }
  ctx.stroke(); ctx.globalAlpha = 1;
}
function drawHUD() {
  ctx.save();
  ctx.textAlign = 'left'; ctx.fillStyle = PAPER; ctx.font = '22px ' + FONT_T; ctx.textBaseline = 'middle';
  ctx.font = '18px ' + FONT_T; ctx.fillText('MOSQUITA MUERTA', 24, CEIL / 2);
  ctx.font = '700 13px ' + FONT_M; ctx.globalAlpha = .6; ctx.fillText('BAJO CUERDA', 26, CEIL / 2 + 22); ctx.globalAlpha = 1;
  ctx.font = '700 30px ' + FONT_M; ctx.fillText(String(Math.floor(score)).padStart(6, '0'), 230, CEIL / 2);
  if (mult > 1) { ctx.fillStyle = AMBER; ctx.font = '700 13px ' + FONT_M; ctx.fillText((players.length > 1 ? 'CUERDA ×' : 'COMBO ×') + mult, 232, CEIL / 2 + 22); }
  // barra de sed compartida
  const bx = W / 2 - 170, bw = 340, by = CEIL / 2 - 4, low = sed < 25;
  ctx.textAlign = 'center'; ctx.font = '700 12px ' + FONT_M; ctx.fillStyle = low && Math.sin(clock * 12) > 0 ? RED : PAPER;
  ctx.fillText(low ? '¡SE MUERE DE SED! RECOJA CERVEZA' : players.length > 1 ? 'SED DEL ENJAMBRE' : 'SED DE LA MOSCA', W / 2, CEIL / 2 - 18);
  ctx.strokeStyle = PAPER; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, 18);
  ctx.fillStyle = low ? RED : AMBER; ctx.fillRect(bx + 3, by + 3, (bw - 6) * clamp(sed / 100, 0, 1), 12);
  ctx.textAlign = 'right'; ctx.fillStyle = PAPER; ctx.font = '700 22px ' + FONT_M;
  ctx.fillText(Math.floor(dist / 50) + ' m', W - 24, CEIL / 2);
  players.forEach((p, i) => {
    const x = W - 150 - (players.length - 1 - i) * 30, y = CEIL / 2;
    ctx.globalAlpha = p.alive ? 1 : .35;
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y, 12, 0, 6.29); ctx.fill();
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '700 13px ' + FONT_M; ctx.fillText(i + 1, x, y + 1);
  });
  ctx.restore();
}
function drawFx() {
  for (const f of fx) {
    const a = clamp(f.life / f.max, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    if (f.k === 'pt') { ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, 6.29); ctx.fill(); }
    else { ctx.font = Math.round(f.size * (touchMode ? 1.3 : 1)) + 'px ' + FONT_T; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = PAPER; ctx.strokeText(f.txt, f.x, f.y); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y); }
    ctx.restore();
  }
}
function drawBanner() {
  if (!banner) return;
  const a = clamp(Math.min(banner.life, 2.4 - banner.life) * 3, 0, 1);
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center';
  ctx.fillStyle = INK; ctx.fillRect(0, H / 2 - 60, W, 104);
  ctx.fillStyle = AMBER; ctx.font = '700 16px ' + FONT_M; ctx.fillText(banner.sub, W / 2, H / 2 - 28);
  ctx.fillStyle = PAPER; ctx.font = '46px ' + FONT_T; ctx.fillText(banner.txt, W / 2, H / 2 + 24);
  ctx.restore();
}
function centerText(txt, y, font, col) { ctx.font = font; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.fillText(txt, W / 2, y); }

function virtualBox(fn) {
  const sW = W, sH = H, sF = FLOOR, k = Math.min(W / 1280, H / 720);
  ctx.save(); ctx.translate((W - 1280 * k) / 2, (H - 720 * k) / 2); ctx.scale(k, k);
  W = 1280; H = 720; FLOOR = 684;
  try { fn(); } finally { W = sW; H = sH; FLOOR = sF; ctx.restore(); }
}
function drawTitle() { virtualBox(drawTitleV); }
function drawTitleV() {
  ctx.save();
  drawFly(W / 2, 205, Math.sin(clock * 1.5) * .08, 1, .62);
  ctx.textBaseline = 'alphabetic';
  centerText('MOSQUITA MUERTA', 360, '84px ' + FONT_T, INK);
  centerText(touchMode ? 'ESQUIVE, TOME CERVEZA Y NO SE MUERA DE SED' : 'DE 1 A 4 JUGADORES · EN EQUIPO VAN AMARRADAS POR LA CUERDA', 395, (touchMode ? '700 24px ' : '700 18px ') + FONT_M, INK);
  const nSlots = touchMode ? 0 : 4;
  if (touchMode && !players.length) { ctx.globalAlpha = .55 + .45 * Math.sin(clock * 5); centerText('TOQUE LA PANTALLA PARA JUGAR', 490, '46px ' + FONT_T, RED); ctx.globalAlpha = 1; }
  for (let i = 0; i < nSlots; i++) {
    const bx = W / 2 - nSlots / 2 * 250 + i * 250 + 10, by = 425, p = players[i];
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.fillStyle = p ? COLORS[i] : 'rgba(20,20,20,.04)';
    ctx.fillRect(bx, by, 230, 92); ctx.strokeRect(bx, by, 230, 92);
    ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.font = '28px ' + FONT_T; ctx.fillText('P' + (i + 1), bx + 14, by + 38);
    ctx.font = '700 13px ' + FONT_M;
    if (p) { ctx.fillText('ADENTRO', bx + 70, by + 34); ctx.fillText(SRC_LABEL[p.src], bx + 14, by + 72); }
    else if (i === players.length) { ctx.globalAlpha = .5 + .5 * Math.sin(clock * 5); ctx.fillText(touchMode ? 'TOQUE SU MITAD' : 'PRESIONE SU', bx + 70, by + 28); ctx.fillText(touchMode ? 'PARA ENTRAR' : 'BOTÓN PARA ENTRAR', bx + 70, by + 46); ctx.globalAlpha = 1; }
    else { ctx.globalAlpha = .35; ctx.fillText('ESPERANDO', bx + 70, by + 34); ctx.globalAlpha = 1; }
  }
  ctx.textAlign = 'center';
  if (countdown > 0) centerText(touchMode ? 'ARRANCA EN ' + Math.ceil(countdown) : 'ARRANCA EN ' + Math.ceil(countdown) + ' · ¿ALGUIEN MÁS? (EN EQUIPO VAN AMARRADAS)', touchMode ? 490 : 560, (touchMode ? '46px ' : '30px ') + FONT_T, RED);
  ctx.fillStyle = INK; ctx.globalAlpha = .8;
  if (touchMode) {
    ctx.font = '700 21px ' + FONT_M;
    ctx.fillText('ARRASTRE EL DEDO EN CUALQUIER PARTE · TOQUE RÁPIDO = ZUMBIDO', W / 2, 590);
    ctx.fillText('TOME CERVEZA PARA NO MORIR DE SED · TOQUE LOS INTERRUPTORES', W / 2, 624);
    if (IOS && !navigator.standalone) { ctx.globalAlpha = .5; ctx.font = '700 15px ' + FONT_M; ctx.fillText('IPHONE: COMPARTIR → AGREGAR A INICIO = PANTALLA COMPLETA', W / 2, 664); }
  } else {
    ctx.font = '700 14px ' + FONT_M;
    ctx.fillText('SOLO: TOME CERVEZA, ESQUIVE Y TOQUE LOS INTERRUPTORES · LA SED NO PERDONA', W / 2, 600);
    ctx.fillText('EN EQUIPO: SOLO LA CUERDA RECOGE CERVEZA · UNA MOSCA POR INTERRUPTOR', W / 2, 624);
    ctx.globalAlpha = .45; ctx.fillText('RÉCORD DE ESTA MÁQUINA: ' + best + '   ·   M = SONIDO', W / 2, 652);
  }
  ctx.restore();
}
function drawOver() {
  ctx.fillStyle = 'rgba(243,238,226,.88)'; ctx.fillRect(0, CEIL, W, FLOOR - CEIL);
  virtualBox(drawOverV);
}
function drawOverV() {
  ctx.save();
  drawFly(W / 2, 190, Math.PI, 1, .45);
  centerText(overWhy || 'SE ACABÓ EL TURNO', 310, '58px ' + FONT_T, INK);
  centerText(String(Math.floor(score)), 400, '82px ' + FONT_T, AMBER);
  centerText(Math.floor(dist / 50) + ' METROS · ' + SCENES[sceneIdx].n, 445, '700 18px ' + FONT_M, INK);
  centerText(newBest ? '★ NUEVO RÉCORD DE LA MÁQUINA ★' : 'RÉCORD DE LA MÁQUINA: ' + best, 495, '26px ' + FONT_T, newBest ? RED : INK);
  if (overT > 1.6) { ctx.globalAlpha = .5 + .5 * Math.sin(clock * 5); centerText(touchMode ? 'TOQUE LA PANTALLA PARA VOLVER' : 'PRESIONE CUALQUIER BOTÓN PARA VOLVER', 570, (touchMode ? '700 24px ' : '700 18px ') + FONT_M, INK); }
  ctx.restore();
}

function drawTouch() {}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(tex, 0, 0);
  drawBg();
  if (state !== 'title' && SCENES[sceneIdx].k === 'calle') drawRain();
  if (state === 'play' || state === 'over') {
    for (const it of items) drawItem(it);
    for (const o of obs) drawObs(o);
    drawRope();
    for (const p of players) drawPlayer(p);
  }
  drawFrame();
  if (state === 'title') { drawTitle(); drawRope(); for (const p of players) drawPlayer(p); }
  drawTouch();
  drawFx();
  if (state !== 'title') drawHUD();
  else { ctx.fillStyle = PAPER; ctx.font = '700 14px ' + FONT_M; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('BAJO CUERDA · CERVECERÍA ARTESANAL · PEREIRA', 24, CEIL / 2); ctx.textAlign = 'right'; ctx.fillText('PROTOTIPO v0.5', W - 24, CEIL / 2); ctx.textBaseline = 'alphabetic'; }
  if (state === 'play') drawBanner();
  if (state === 'over') drawOver();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
if (COARSE) enterTouchMode();
fit();
scrollBg(0, 'planta');
const go = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('40px "Archivo Black"'), document.fonts.load('700 14px "Space Mono"')]).then(go, go); else go();
})();
</script>
